<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chart — Veterinary &amp; Pharmacy Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2F0;
    --surface:#FFFFFF;
    --ink:#16241F;
    --ink-soft:#5B6D66;
    --line:#DAE2DE;
    --teal:#0E6B5C;
    --teal-deep:#0A4F44;
    --teal-tint:#E4F0EC;
    --amber:#B9772C;
    --amber-tint:#F6EBDC;
    --rose:#AE3B3B;
    --rose-tint:#F8E9E9;
    --admin:#5B5470;
    --admin-tint:#ECE9F3;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,36,30,.06), 0 8px 24px -12px rgba(16,36,30,.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans','Noto Sans Khmer',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces','Noto Sans Khmer',serif; font-weight:600; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}

  /* ---------- Login screen ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(14,107,92,.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(185,119,44,.10), transparent 40%),
      var(--bg);
    padding:24px;
  }
  .login-card{
    width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); padding:34px 30px 28px;
    position:relative; overflow:hidden;
  }
  .login-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:repeating-linear-gradient(90deg, var(--teal) 0 22px, var(--amber) 22px 44px);
    opacity:.85;
  }
  .login-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--teal-deep); margin-bottom:6px;
  }
  .login-card h1{font-size:26px; line-height:1.15; margin-bottom:4px;}
  .login-sub{color:var(--ink-soft); font-size:13px; margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500;}
  .field input, .field select{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px;
    background:#FBFCFB; color:var(--ink); outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus{border-color:var(--teal);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 16px; border-radius:7px; border:1px solid transparent;
    font-weight:500; font-size:13.5px; transition:filter .15s, background .15s;
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:#9AB6AF; cursor:not-allowed;}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:var(--teal-tint); border-color:var(--teal);}
  .btn-danger{background:transparent; border-color:var(--rose); color:var(--rose);}
  .btn-danger:hover{background:var(--rose-tint);}
  .btn-block{width:100%;}
  .login-toggle{
    text-align:center; margin-top:16px; font-size:12.5px; color:var(--ink-soft);
  }
  .login-toggle a{color:var(--teal-deep); cursor:pointer; font-weight:500; text-decoration:none;}
  .login-toggle a:hover{text-decoration:underline;}
  .login-err{
    background:var(--rose-tint); color:var(--rose); border:1px solid #e6c7c7;
    padding:8px 10px; border-radius:7px; font-size:12.5px; margin-bottom:14px; display:none;
  }
  .baseurl-row{display:flex; gap:8px; margin-top:18px;}
  .baseurl-row input{flex:1;}

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100vh; grid-template-columns:250px 1fr;}
  #app.active{display:grid;}
  #sidebar{
    background:var(--teal-deep); color:#EAF2EF; padding:22px 0 16px;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:14px;}
  .brand .mark{
    width:34px; height:34px; border-radius:8px; background:var(--amber);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
    font-weight:700; color:#241804; margin-bottom:10px; font-size:16px;
  }
  .brand h1{font-size:17px; color:#fff; line-height:1.2;}
  .brand p{margin:3px 0 0; font-size:11px; color:#B9CFC8; font-family:'IBM Plex Mono',monospace;}

  .nav-group{margin-bottom:4px;}
  .nav-group-label{
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:#8FB0A7; padding:14px 20px 6px; font-family:'IBM Plex Mono',monospace;
  }
  .nav-item{
    position:relative; display:flex; align-items:center; gap:10px;
    padding:9px 20px 9px 22px; color:#D6E7E1; text-decoration:none; font-size:13.5px;
    cursor:pointer; border-left:3px solid transparent; user-select:none;
  }
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{
    background:rgba(255,255,255,.09); color:#fff; border-left-color:var(--amber); font-weight:500;
  }
  .nav-item .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex-shrink:0;}
  .nav-item .soon{
    margin-left:auto; font-size:9.5px; font-family:'IBM Plex Mono',monospace;
    background:rgba(255,255,255,.12); color:#C9D8D3; padding:2px 6px; border-radius:20px;
    letter-spacing:.04em;
  }
  .nav-item.disabled{opacity:.55; cursor:default;}
  .nav-item.disabled:hover{background:transparent; color:#D6E7E1;}

  .sidebar-foot{margin-top:auto; padding:14px 20px 0; border-top:1px solid rgba(255,255,255,.12);}
  .who{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .who .avatar{
    width:30px; height:30px; border-radius:50%; background:var(--amber); color:#241804;
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px;
  }
  .who .name{font-size:13px; color:#fff; font-weight:500;}
  .who .role{font-size:11px; color:#9FC0B7; font-family:'IBM Plex Mono',monospace;}
  .logout-btn{
    width:100%; background:transparent; border:1px solid rgba(255,255,255,.18); color:#D6E7E1;
    padding:7px; border-radius:7px; font-size:12.5px;
  }
  .logout-btn:hover{background:rgba(255,255,255,.08);}

  /* ---------- Main content ---------- */
  #main{padding:26px 32px 60px; overflow-y:auto; height:100vh;}
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .topbar .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.1em; margin-bottom:4px;}
  .topbar h2{font-size:24px;}
  .conn-pill{
    display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--line); padding:6px 12px; border-radius:20px;
  }
  .conn-dot{width:7px; height:7px; border-radius:50%; background:#8ea89f;}
  .conn-dot.ok{background:var(--teal);}
  .conn-dot.bad{background:var(--rose);}

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px;
    border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap;
  }
  .panel-head .count{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);
    background:var(--bg); padding:3px 9px; border-radius:20px; margin-left:8px;
  }
  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); padding:10px 18px; border-bottom:1px solid var(--line); background:#FAFBFA;
    font-weight:600;
  }
  tbody td{padding:11px 18px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13.5px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFA;}
  .id-chip{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal-deep);
    background:var(--teal-tint); padding:2px 7px; border-radius:5px;
  }
  .row-actions{display:flex; gap:6px;}
  .icon-btn{
    border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:5px 9px; font-size:12px; color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--teal); color:var(--teal-deep); background:var(--teal-tint);}
  .icon-btn.del:hover{border-color:var(--rose); color:var(--rose); background:var(--rose-tint);}

  .empty-state{padding:48px 20px; text-align:center; color:var(--ink-soft);}
  .empty-state h3{font-size:16px; color:var(--ink); margin-bottom:6px;}
  .empty-state p{font-size:13px; margin:0 auto; max-width:340px; line-height:1.6;}

  .soon-panel{padding:28px;}
  .soon-badge{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px;
    background:var(--admin-tint); color:var(--admin); padding:3px 10px; border-radius:20px; margin-bottom:14px;
  }
  .schema-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:16px;
  }
  .schema-field{
    border:1px dashed var(--line); border-radius:7px; padding:8px 10px; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; color:var(--ink-soft); background:#FAFBFA;
  }
  .schema-field b{color:var(--ink); font-weight:600;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,30,26,.45); display:none; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .overlay.active{display:flex;}
  .modal{
    background:var(--surface); border-radius:12px; width:100%; max-width:460px; max-height:88vh;
    overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); border:1px solid var(--line);
  }
  .modal-head{padding:18px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{font-size:17px;}
  .modal-close{background:none; border:none; font-size:18px; color:var(--ink-soft); line-height:1;}
  .modal-body{padding:18px 20px;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.2); border-left:3px solid var(--teal); animation:slidein .2s ease-out;
    max-width:320px;
  }
  .toast.err{border-left-color:var(--rose);}
  @keyframes slidein{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}

  @media (max-width:820px){
    #app.active{display:block;}
    #sidebar{position:relative; height:auto; flex-direction:row; flex-wrap:wrap; padding:14px;}
    .brand{border:none; margin:0; padding:0 12px 0 0; display:flex; align-items:center; gap:8px;}
    .brand .mark{margin:0;}
    .nav-group-label{display:none;}
    .nav-group{display:flex; flex-wrap:wrap; gap:4px;}
    .nav-item{border-left:none; border-radius:7px; padding:7px 12px;}
    .sidebar-foot{display:none;}
    #main{height:auto; padding:20px 16px 40px;}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-eyebrow">Chart · Clinic &amp; Pharmacy System</div>
    <h1 id="loginTitle">ចូលប្រើប្រព័ន្ធ</h1>
    <p class="login-sub" id="loginSub">សូមបញ្ចូល email និង password របស់អ្នក</p>

    <div class="login-err" id="loginErr"></div>

    <form id="loginForm">
      <div class="field" id="nameField" style="display:none;">
        <label>ឈ្មោះពេញ</label>
        <input type="text" id="regName" placeholder="Dr. Sok Dara" />
      </div>
      <div class="field" id="phoneField" style="display:none;">
        <label>លេខទូរស័ព្ទ</label>
        <input type="text" id="regPhone" placeholder="012 345 678" />
      </div>
      <div class="field">
        <label>អ៊ីមែល</label>
        <input type="email" id="authEmail" placeholder="you@clinic.com" required />
      </div>
      <div class="field">
        <label>ពាក្យសម្ងាត់</label>
        <input type="password" id="authPassword" placeholder="••••••••" required />
      </div>
      <div class="field" id="roleField" style="display:none;">
        <label>តួនាទី</label>
        <select id="regRole">
          <option value="Admin">Admin</option>
          <option value="Veterinarian">Veterinarian</option>
          <option value="Pharmacist">Pharmacist</option>
          <option value="User">User</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="authSubmitBtn">ចូល / Login</button>
    </form>

    <div class="login-toggle" id="loginToggle">
      មិនទាន់មាន account? <a id="toRegister">បង្កើត account</a>
    </div>

    <details style="margin-top:16px;">
      <summary style="font-size:12px; color:var(--ink-soft); cursor:pointer;">API endpoint</summary>
      <div class="baseurl-row">
        <input type="text" id="baseUrlInput" placeholder="http://localhost:8080" value="http://localhost:8080" />
        <button class="btn btn-ghost" id="pingBtn" type="button">Ping</button>
      </div>
    </details>

    <button type="button" class="btn btn-ghost btn-block" id="demoBtn" style="margin-top:10px;">
      ▶ ចូលមើលគំរូ (Demo — គ្មាន server ក៏ប្រើបាន)
    </button>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">C</div>
      <div>
        <h1>Chart</h1>
        <p id="apiUrlLabel">localhost:8080</p>
      </div>
    </div>

    <nav id="navClinical" class="nav-group">
      <div class="nav-group-label">Clinical</div>
    </nav>
    <nav id="navPharmacy" class="nav-group">
      <div class="nav-group-label">Pharmacy</div>
    </nav>
    <nav id="navAdmin" class="nav-group">
      <div class="nav-group-label">Admin</div>
    </nav>

    <div class="sidebar-foot">
      <div class="who">
        <div class="avatar" id="whoAvatar">?</div>
        <div>
          <div class="name" id="whoName">—</div>
          <div class="role" id="whoRole">—</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">ចាកចេញ</button>
    </div>
  </aside>

  <main id="main">
    <div class="topbar">
      <div>
        <div class="eyebrow" id="sectionEyebrow">Clinical / Records</div>
        <h2 id="sectionTitle">Owners</h2>
      </div>
      <div class="conn-pill"><span class="conn-dot" id="connDot"></span><span id="connLabel">Not checked</span></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">បោះបង់</button>
      <button class="btn btn-primary" id="modalSave">រក្សាទុក</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){
  "use strict";

  /* ---------------- state (in-memory only, no storage APIs) ---------------- */
  const state = {
    baseUrl: "http://localhost:8080",

        {_id:ownerIds[3], name:"Pich Sreymom", phone:"098 111 333", email:"sreymom.pich@gmail.com", address:"ខេត្តសៀមរាប"},
        {_id:ownerIds[4], name:"Heng Vibol", phone:"015 909 707", email:"vibol.heng@gmail.com", address:"ខេត្តបាត់ដំបង"},
      ],
      animals: animalIds,
      vets: vetIds,
      records: [
        {_id:oid(), animal_id:animalIds[0], owner_id:ownerIds[0], veterinarian_id:vetIds[0], symptoms:"ក្អក, គ្មានចំណង់អាហារ", diagnosis:"ជំងឺផ្លូវដង្ហើមស្រាល", treatment:"អង់ទីប៊ីយោទិចរយៈពេល ៥ ថ្ងៃ"},
        {_id:oid(), animal_id:animalIds[1], owner_id:ownerIds[1], veterinarian_id:vetIds[0], symptoms:"រមាស់ស្បែក, រលាក", diagnosis:"ជំងឺស្បែកដោយសារ mite", treatment:"ថ្នាំលាបស្បែក + ងូតទឹកឱសថ"},
        {_id:oid(), animal_id:animalIds[2], owner_id:ownerIds[2], veterinarian_id:vetIds[1], symptoms:"ក្អួត, រាគ", diagnosis:"រំខានក្រពះពោះវៀន", treatment:"អត់ចំណីអាហារ ២៤ម៉ោង + សេរ៉ូម"},
        {_id:oid(), animal_id:animalIds[3], owner_id:ownerIds[0], veterinarian_id:vetIds[1], symptoms:"ខ្វិនជើងក្រោយ", diagnosis:"របួសសន្លាក់", treatment:"ថ្នាំបំបាត់ការឈឺចាប់ + សម្រាក"},
        {_id:oid(), animal_id:animalIds[4], owner_id:ownerIds[3], veterinarian_id:vetIds[0], symptoms:"ក្តៅខ្លួន, ខ្សោយ", diagnosis:"ជំងឺគ្រុនកកកុន", treatment:"ចាក់ថ្នាំបញ្ចុះកម្ដៅ + សង្កេត"},
      ],
      medicines: [
        {_id:oid(), name:"Amoxicillin 250mg", generic_name:"Amoxicillin", category:{name:"Antibiotic"}, manufacturer:"VetPharm Co.", purchase_price:0.15, selling_price:0.35},

  function mockApi(path, opts){
    const method = (opts.method || "GET").toUpperCase();
    const body = opts.body ? JSON.parse(opts.body) : {};
    const m = path.match(/^\/api\/(owners|records|medicines)(?:\/([a-f0-9]+))?$/);
    return new Promise((resolve, reject)=>{
      setTimeout(()=>{ // tiny delay so it feels like a real network call
        if (!m) return reject(new Error("Demo mode: endpoint " + path + " មិនត្រូវបានគាំទ្រ"));
        const table = mockDb[m[1]];
        const id = m[2];
        try{
          if (method === "GET") return resolve(table);
          if (method === "POST"){
            const row = Object.assign({_id: oid()}, body);
            table.unshift(row);
            return resolve({message:"created", data:row});
          }
          if (method === "PUT"){
            const idx = table.findIndex(r=>r._id===id);
            if (idx===-1) return reject(new Error("រកមិនឃើញកំណត់ត្រា"));
            table[idx] = Object.assign({}, table[idx], body, {_id:id});
            return resolve({message:"updated"});
          }
          if (method === "DELETE"){
            const idx = table.findIndex(r=>r._id===id);
            if (idx>-1) table.splice(idx,1);
            return resolve({message:"deleted"});
          }
          reject(new Error("Method មិនត្រូវបានគាំទ្រក្នុង demo"));
        }catch(e){ reject(e); }
      }, 220);
    });
  }

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    kids.flat().forEach(k => { if (k!=null) n.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
    return n;

  async function api(path, opts={}){
    if (state.demoMode) return mockApi(path, opts);
    const url = state.baseUrl.replace(/\/$/,"") + path;
    const headers = Object.assign({"content-type":"application/json"}, opts.headers||{});
    if (state.token) headers["Authorization"] = "Bearer " + state.token;
    let res;
    try{
      res = await fetch(url, Object.assign({}, opts, {headers}));
    } catch(e){
      throw new Error("មិនអាចទាក់ទង API បានទេ — ពិនិត្យ base URL ឬសូមប្រាកដថា server កំពុងដំណើរការ (CORS ក៏អាចជាមូលហេតុ)");
    }
    let data = null;
    const text = await res.text();
    try{ data = text ? JSON.parse(text) : null; }catch(e){ data = {raw:text}; }
    if (!res.ok){
      const msg = (data && (data.error || data.message)) || ("HTTP " + res.status);
      throw new Error(msg);
    }
    return data;
  }

      delBtn.addEventListener("click", ()=> confirmDelete(key, id));
      actions.appendChild(editBtn); actions.appendChild(delBtn);
      const tr = el("tr", {}, tds, el("td", {style:"text-align:right;"}, actions));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  async function confirmDelete(key, id){
    if (!confirm("តើអ្នកប្រាកដថាចង់លុបកំណត់ត្រានេះមែនទេ?")) return;
    const s = SCHEMA[key];
    try{
      await api(`${s.endpoint}/${id}`, {method:"DELETE"});
      toast("បានលុបជោគជ័យ");
      renderLiveSection(key);
    }catch(err){ toast(err.message, true); }
  }

  /* ---------------- modal form ---------------- */
  let editingId = null;
  function openForm(key, row){
    const s = SCHEMA[key];
    editingId = row ? (row._id || row.id) : null;
    $("#modalTitle").textContent = (row ? "កែប្រែ — " : "បន្ថែម — ") + s.label;
    const body = $("#modalBody");
    body.innerHTML = "";
    s.form.forEach(f=>{
      const value = row ? (f.nested ? get(row, f.key+"."+f.nested) : row[f.key]) : "";
      const wrap = el("div", {class:"field"});
      wrap.appendChild(el("label", {}, f.label + (f.required? " *":"")));
      let input;
      if (f.type === "textarea"){
        input = el("textarea", {rows:"3", "data-key":f.key, "data-nested":f.nested||"", style:"width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; resize:vertical;"});
        input.value = value ?? "";
      } else {
        input = el("input", {type:f.type, "data-key":f.key, "data-nested":f.nested||"", class: f.mono ? "mono":""});
        input.value = value ?? "";
      }
      wrap.appendChild(input);
      body.appendChild(wrap);
    });
    $("#overlay").classList.add("active");
    $("#modalSave").onclick = ()=> saveForm(key);
  }

  function closeModal(){ $("#overlay").classList.remove("active"); editingId = null; }
  $("#modalClose").addEventListener("click", closeModal);
  $("#modalCancel").addEventListener("click", closeModal);
  $("#overlay").addEventListener("click", (e)=>{ if (e.target.id==="overlay") closeModal(); });

  async function saveForm(key){
    const s = SCHEMA[key];
    const inputs = $("#modalBody").querySelectorAll("[data-key]");
    const payload = {};
    let missing = null;
    inputs.forEach(inp=>{
      const k = inp.getAttribute("data-key");
      const nested = inp.getAttribute("data-nested");
      let v = inp.value;
      if (inp.type === "number") v = v === "" ? 0 : Number(v);
      if (nested){ payload[k] = payload[k] || {}; payload[k][nested] = v; }
      else payload[k] = v;
      const fdef = s.form.find(f=>f.key===k);
      if (fdef && fdef.required && !v) missing = fdef.label;
    });
    if (missing){ toast("សូមបំពេញ៖ " + missing, true); return; }

    try{
      if (editingId){
        if (!s.methods.update){ toast("Backend មិនទាន់មាន update route សម្រាប់ផ្នែកនេះ", true); return; }
        await api(`${s.endpoint}/${editingId}`, {method:s.methods.update, body: JSON.stringify(payload)});
        toast("បានកែប្រែជោគជ័យ");
      } else {
        await api(s.endpoint, {method:s.methods.create, body: JSON.stringify(payload)});
        toast("បានបន្ថែមជោគជ័យ");
      }
      closeModal();
      renderLiveSection(key);
    }catch(err){ toast(err.message, true); }
  }

})();
</script>
</body>
</html>
